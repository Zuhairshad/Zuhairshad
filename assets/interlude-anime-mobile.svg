<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-label="Original silver-haired anime character with a light blade, drawn entirely with SVG paths; The work between frames">
<defs>
  <linearGradient id="sky2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b0d17"/><stop offset=".6" stop-color="#1b1726"/><stop offset="1" stop-color="#352235"/></linearGradient>
  <linearGradient id="skin2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1c2aa"/><stop offset=".55" stop-color="#ca938b"/><stop offset="1" stop-color="#9a6870"/></linearGradient>
  <filter id="blur2"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="frame2"><rect width="720" height="640" rx="11"/></clipPath>
  <style>
    .label{font:20px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;fill:#ea7883}
    .meta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#dcc9c9}
    .headline{font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:-.055em;fill:#f5eee7}
    .blade-flash{animation:blade 4.6s ease-in-out infinite}
    .ring2{animation:breathe 6s ease-in-out infinite}
    .ash{animation:ash 5s ease-in-out infinite}
    @keyframes blade{0%,27%,100%{opacity:.35}43%,55%{opacity:1}}
    @keyframes breathe{50%{opacity:.58;transform:scale(1.03)}}
    @keyframes ash{50%{opacity:.25;transform:translateY(-12px)}}
    @media(prefers-reduced-motion:reduce){.blade-flash,.ring2,.ash{animation:none}}
  </style>
</defs>
