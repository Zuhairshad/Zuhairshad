<svg xmlns="http://www.w3.org/2000/svg" width="720" height="700" viewBox="0 0 720 700" role="img" aria-label="Original anime-style vector character introducing Zuhair Shad, full-stack developer in Pakistan">
<defs>
 <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#080a13"/><stop offset=".55" stop-color="#171222"/><stop offset="1" stop-color="#3e2337"/></linearGradient>
 <radialGradient id="moon"><stop stop-color="#f79f88"/><stop offset=".6" stop-color="#d84b5a"/><stop offset="1" stop-color="#772d48"/></radialGradient>
 <linearGradient id="skin" x2="1" y2="1"><stop stop-color="#f1c5ab"/><stop offset=".56" stop-color="#c89287"/><stop offset="1" stop-color="#8b5d68"/></linearGradient>
 <linearGradient id="scarf" x2="1" y2="0"><stop stop-color="#ac3045"/><stop offset=".6" stop-color="#e0555a"/><stop offset="1" stop-color="#8d253d"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
 <clipPath id="frame"><rect width="720" height="700" rx="12"/></clipPath>
 <style>
 .name{font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:-.075em;paint-order:stroke fill;stroke:#080a13;stroke-width:2}
 .meta{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.13em}
 .scarf{animation:scarf 4.8s ease-in-out infinite;transform-box:fill-box}
 .spark{animation:spark 3.4s ease-in-out infinite}
 .moonring{animation:ring 5s ease-in-out infinite}
 .scan{animation:scan 7s linear infinite}
 @keyframes scarf{50%{transform:rotate(2deg) translateX(7px)}}
 @keyframes spark{50%{opacity:.3;transform:translateY(-9px)}}
 @keyframes ring{50%{opacity:.5;transform:scale(1.025)}}
 @keyframes scan{50%{opacity:.55}}
 @media(prefers-reduced-motion:reduce){.scarf,.spark,.moonring,.scan{animation:none}}
 </style>
</defs>
<g clip-path="url(#frame)">
 <rect width="720" height="700" fill="url(#sky)"/>
 <path d="M0 588 Q240 504 720 574V700H0Z" fill="#0a0c16" opacity=".8"/>
 <path d="M0 664 Q360 570 720 637" fill="none" stroke="#bd4b5a" stroke-width="3" opacity=".37"/>
 <circle cx="525" cy="385" r="188" fill="url(#moon)" opacity=".92"/>
 <circle class="moonring" cx="525" cy="385" r="209" fill="none" stroke="#d65a66" stroke-width="3" opacity=".34" style="transform-origin:525px 385px"/>
 <path d="M45 44H675 M45 652H675" stroke="#7b4651" opacity=".54" stroke-width="2"/>
 <g opacity=".46" stroke="#e49a92" stroke-width="2"><path d="M440 51l-40 122 M580 21l-48 166 M667 173l-39 127 M310 260l-43 138"/></g>
 <g transform="translate(328 180) scale(1.08)">
