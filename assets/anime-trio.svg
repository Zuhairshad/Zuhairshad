    @keyframes slash{0%,35%,100%{opacity:.35}48%,58%{opacity:1}}
    @keyframes hat{50%{transform:rotate(1.5deg)}}
    @media(prefers-reduced-motion:reduce){.chakra,.moon,.horizon,.slash,.hat{animation:none}}
  </style>
</defs>
