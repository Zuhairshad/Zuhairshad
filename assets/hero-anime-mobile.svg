  <!-- Hand and glowing cursor-line, an engineering cue rather than a weapon. -->
  <path d="M266 429 Q300 402 327 423 L333 455 Q313 471 290 456Z" fill="#b5837d" stroke="#5b3c47" stroke-width="4"/>
  <path d="M290 427 Q304 419 315 428 M295 439 Q309 434 322 440" fill="none" stroke="#e4aea0" stroke-width="2"/>
  <path d="M320 443 L402 414" stroke="#e25358" stroke-width="10" filter="url(#glow)" opacity=".65"/>
  <path d="M320 443 L402 414" stroke="#f5a09a" stroke-width="4"/>
</g></g>
 <g class="spark" fill="#ed6570" opacity=".9"><circle cx="415" cy="114" r="4"/><circle cx="647" cy="286" r="3"/><circle cx="348" cy="369" r="5"/></g>
 <path class="scan" d="M396 58L660 625" stroke="#ed6570" stroke-width="5" opacity=".3"/>
 <text x="49" y="80" class="meta" font-size="20" fill="#ed6570">ZS / BUILD LOG 001</text>
 <text x="49" y="163" class="name" font-size="95" fill="#f8eee5">Zuhair</text><text x="49" y="254" class="name" font-size="95" fill="#f8eee5">Shad<tspan fill="#ed6570">.</tspan></text><text x="49" y="611" class="meta" font-size="21" fill="#e4c4c0">FULL-STACK DEVELOPER</text><text x="49" y="642" class="meta" font-size="21" fill="#e4c4c0">BASED IN PAKISTAN</text>
 <path d="M45 652h112" stroke="#ed6570" stroke-width="5"/>
</g></svg>